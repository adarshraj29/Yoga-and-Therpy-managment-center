{% extends "base.html" %}
{% block title %}Register — YogaCare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="form-card">
                <!-- Header -->
                <div class="text-center mb-4">
                    <div style="font-size:3rem;">🌿</div>
                    <h2 class="fw-bold mt-2" style="color:var(--dark);">Create Your Account</h2>
                    <p class="text-muted" style="font-size:0.9rem;">Join YogaCare and start your wellness journey today</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}" class="form-yoga" novalidate>

                    <div class="row g-3">
                        <div class="col-12">
                            <label for="full_name" class="form-label">
                                <i class="bi bi-person me-1" style="color:var(--primary);"></i> Full Name *
                            </label>
                            <input type="text" class="form-control" id="full_name" name="full_name"
                                   placeholder="e.g. Ananya Singh"
                                   value="{{ form.get('full_name','') }}" required autofocus>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">
                                <i class="bi bi-envelope me-1" style="color:var(--primary);"></i> Email Address *
                            </label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="you@example.com"
                                   value="{{ form.get('email','') }}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">
                                <i class="bi bi-telephone me-1" style="color:var(--primary);"></i> Phone Number
                            </label>
                            <input type="tel" class="form-control" id="phone" name="phone"
                                   placeholder="e.g. 9876543210"
                                   value="{{ form.get('phone','') }}">
                        </div>

                        <div class="col-md-6">
                            <label for="gender" class="form-label">
                                <i class="bi bi-gender-ambiguous me-1" style="color:var(--primary);"></i> Gender
                            </label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="">Select gender</option>
                                <option value="Male"   {% if form.get('gender')=='Male'   %}selected{% endif %}>Male</option>
                                <option value="Female" {% if form.get('gender')=='Female' %}selected{% endif %}>Female</option>
                                <option value="Other"  {% if form.get('gender')=='Other'  %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1" style="color:var(--primary);"></i> Password *
                                <small class="text-muted fw-normal">(min 6 chars)</small>
                            </label>
                            <input type="password" class="form-control" id="password"
                                   name="password" placeholder="At least 6 characters" required>
                        </div>

                        <div class="col-12">
                            <label for="confirm_password" class="form-label">
                                <i class="bi bi-lock-fill me-1" style="color:var(--primary);"></i> Confirm Password *
                            </label>
                            <input type="password" class="form-control" id="confirm_password"
                                   name="confirm_password" placeholder="Repeat your password" required>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn-yoga-primary w-100 py-2" style="font-size:1rem;">
                            <i class="bi bi-person-plus me-2"></i>Create Account
                        </button>
                    </div>

                </form>

                <p class="text-center mt-3 mb-0" style="font-size:0.88rem;color:var(--text-muted);">
                    Already registered?
                    <a href="{{ url_for('auth.login') }}" style="color:var(--primary);font-weight:600;">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
