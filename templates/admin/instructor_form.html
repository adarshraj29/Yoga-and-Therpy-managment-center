{% extends "base.html" %}
{% block title %}{{ action }} Instructor — Admin{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container">
        <h1><i class="bi bi-person-badge me-2"></i>{{ action }} Instructor</h1>
    </div>
</div>
<div class="container">
    <div class="form-card" style="max-width:700px;">
        <form method="POST" class="form-yoga">
            <h6 class="fw-bold mb-3" style="color:var(--primary);">Account Details</h6>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="full_name" class="form-label">Full Name *</label>
                    <input type="text" class="form-control" id="full_name" name="full_name"
                           value="{{ instructor.get('full_name','') }}" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ instructor.get('email','') }}"
                           {% if action=='Edit' %}readonly{% else %}required{% endif %}>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone"
                           value="{{ instructor.get('phone','') }}">
                </div>
                <div class="col-md-6">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender">
                        <option value="">Select</option>
                        {% for g in ['Male','Female','Other'] %}
                        <option value="{{ g }}" {% if instructor.get('gender')==g %}selected{% endif %}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% if action == 'Add' %}
                <div class="col-12">
                    <label for="password" class="form-label">Password *</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Min 6 characters" required>
                </div>
                {% endif %}
            </div>

            <hr class="my-4">
            <h6 class="fw-bold mb-3" style="color:var(--primary);">Professional Profile</h6>
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="specialization" class="form-label">Specialization</label>
                    <input type="text" class="form-control" id="specialization" name="specialization"
                           value="{{ instructor.get('specialization','') }}"
                           placeholder="e.g. Hatha Yoga, Pranayama">
                </div>
                <div class="col-md-4">
                    <label for="experience_years" class="form-label">Experience (Years)</label>
                    <input type="number" class="form-control" id="experience_years"
                           name="experience_years" value="{{ instructor.get('experience_years', 0) }}"
                           min="0" max="50">
                </div>
                <div class="col-12">
                    <label for="certification" class="form-label">Certification</label>
                    <input type="text" class="form-control" id="certification" name="certification"
                           value="{{ instructor.get('certification','') }}"
                           placeholder="e.g. RYT-500, Yoga Alliance">
                </div>
                <div class="col-12">
                    <label for="bio" class="form-label">Bio</label>
                    <textarea class="form-control" id="bio" name="bio" rows="3"
                              placeholder="Brief professional biography…">{{ instructor.get('bio','') }}</textarea>
                </div>
            </div>

            <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn-yoga-primary px-5 py-2">
                    <i class="bi bi-check-lg me-1"></i> {{ action }} Instructor
                </button>
                <a href="{{ url_for('admin.instructors') }}" class="btn-yoga-outline px-4 py-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
