{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div style="font-size:5rem;">🔍</div>
    <h1 style="font-size:5rem;color:var(--primary);font-weight:700;">404</h1>
    <h3>Page Not Found</h3>

</div>
{% endblock %}
