{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div style="font-size:5rem;">⚠️</div>
    <h1 style="font-size:5rem;color:var(--danger);font-weight:700;">500</h1>

</div>
{% endblock %}
